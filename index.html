<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Velociton Mining Mini App</title>
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: #0f172a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 100vh;
      padding: 20px 16px;
      overflow: hidden;
    }
    .header {
      text-align: center;
      margin-top: 10px;
    }
    .badge {
      background: rgba(56, 189, 248, 0.1);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
    }
    .balance-container {
      margin-top: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .balance-val {
      font-size: 42px;
      font-weight: 800;
      color: #ffffff;
    }
    .balance-sym {
      font-size: 20px;
      color: #38bdf8;
      font-weight: 700;
    }
    .coin-wrapper {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 30px 0;
    }
    .coin-btn {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
      box-shadow: 0 0 35px rgba(56, 189, 248, 0.4), inset 0 0 15px rgba(255, 255, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 80px;
      cursor: pointer;
      transition: transform 0.05s ease-out;
      border: 4px solid rgba(255, 255, 255, 0.2);
    }
    .coin-btn:active {
      transform: scale(0.94);
    }
    .floating-text {
      position: absolute;
      color: #38bdf8;
      font-size: 28px;
      font-weight: 800;
      pointer-events: none;
      animation: floatUp 0.8s ease-out forwards;
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-80px) scale(1.2); }
    }
    .stats-card {
      background: #1e293b;
      width: 100%;
      max-width: 360px;
      border-radius: 16px;
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      margin-bottom: 20px;
    }
    .energy-bar-bg {
      width: 100%;
      height: 10px;
      background: #334155;
      border-radius: 5px;
      overflow: hidden;
      margin-top: 8px;
    }
    .energy-bar-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      transition: width 0.2s ease;
    }
    .energy-info {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="header">
    <span class="badge">VELOCITON NETWORK</span>
    <div class="balance-container">
      <span id="balance" class="balance-val">0</span>
      <span class="balance-sym">$pVTON</span>
    </div>
  </div>

  <div class="coin-wrapper">
    <div id="coinBtn" class="coin-btn">⚡</div>
  </div>

  <div class="stats-card">
    <div class="energy-info">
      <span>⚡ Energy</span>
      <span id="energyText">1000 / 1000</span>
    </div>
    <div class="energy-bar-bg">
      <div id="energyFill" class="energy-bar-fill"></div>
    </div>
  </div>

  <script>
    // Ініціалізація Telegram Web App
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    // Стан застосунку
    let balance = parseFloat(localStorage.getItem('vton_balance')) || 0;
    let energy = parseInt(localStorage.getItem('vton_energy')) || 1000;
    const maxEnergy = 1000;

    const balanceEl = document.getElementById('balance');
    const energyTextEl = document.getElementById('energyText');
    const energyFillEl = document.getElementById('energyFill');
    const coinBtn = document.getElementById('coinBtn');

    function updateUI() {
      balanceEl.innerText = balance.toLocaleString();
      energyTextEl.innerText = `${energy} / ${maxEnergy}`;
      energyFillEl.style.width = `${(energy / maxEnergy) * 100}%`;
    }

    updateUI();

    // Клік по коіну / Майнінг
    coinBtn.addEventListener('click', (e) => {
      if (energy <= 0) return;

      balance += 1;
      energy -= 1;

      localStorage.setItem('vton_balance', balance);
      localStorage.setItem('vton_energy', energy);

      updateUI();

      // Анімація вилітаючої цифри +1
      const floating = document.createElement('div');
      floating.className = 'floating-text';
      floating.innerText = '+1';
      
      const rect = coinBtn.getBoundingClientRect();
      const x = e.clientX - rect.left - 15;
      const y = e.clientY - rect.top - 20;
      
      floating.style.left = `${x}px`;
      floating.style.top = `${y}px`;

      coinBtn.parentElement.appendChild(floating);

      setTimeout(() => {
        floating.remove();
      }, 800);
    });

    // Регенерація енергії (+1 енергія щосекунди)
    setInterval(() => {
      if (energy < maxEnergy) {
        energy += 1;
        localStorage.setItem('vton_energy', energy);
        updateUI();
      }
    }, 1000);
  </script>
</body>
</html>
