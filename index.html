<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Velociton Gold Miner</title>
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: #090d16;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 100vh;
      padding: 24px 16px;
      overflow: hidden;
      position: relative;
    }

    /* Фонові елементи (цікаві деталі на чорному фоні) */
    .bg-particles {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }
    .particle {
      position: absolute;
      background: rgba(234, 179, 8, 0.3);
      border-radius: 50%;
      animation: floatParticle 6s infinite linear;
    }
    .particle:nth-child(odd) {
      background: rgba(56, 189, 248, 0.25);
      animation-duration: 8s;
    }
    @keyframes floatParticle {
      0% { transform: translateY(105vh) scale(0.5); opacity: 0; }
      50% { opacity: 0.8; }
      100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
    }

    .header, .miner-container, .status-card {
      position: relative;
      z-index: 1;
    }

    .header {
      text-align: center;
      margin-top: 10px;
    }
    .tag {
      background: rgba(234, 179, 8, 0.15);
      color: #eab308;
      border: 1px solid rgba(234, 179, 8, 0.4);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.5px;
    }
    .balance-box {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .balance-label {
      color: #94a3b8;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .balance-amount {
      font-size: 44px;
      font-weight: 900;
      background: linear-gradient(135deg, #fef08a 0%, #eab308 50%, #ca8a04 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-top: 4px;
    }
    .miner-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 20px 0;
    }
    .gold-orb {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fef08a 0%, #eab308 45%, #854d0e 100%);
      box-shadow: 0 0 50px rgba(234, 179, 8, 0.45), inset 0 0 25px rgba(255, 255, 255, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid rgba(254, 240, 138, 0.6);
      position: relative;
      animation: goldPulse 2s infinite ease-in-out;
    }
    @keyframes goldPulse {
      0% { transform: scale(1); box-shadow: 0 0 35px rgba(234, 179, 8, 0.35); }
      50% { transform: scale(1.04); box-shadow: 0 0 65px rgba(234, 179, 8, 0.65); }
      100% { transform: scale(1); box-shadow: 0 0 35px rgba(234, 179, 8, 0.35); }
    }
    /* Блискавка всередині золотистої монети */
    .coin-lightning {
      font-size: 90px;
      filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.8));
      animation: lightningFlicker 3s infinite alternate;
    }
    @keyframes lightningFlicker {
      0% { transform: scale(1); filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.6)); }
      100% { transform: scale(1.08); filter: drop-shadow(0 0 16px rgba(56, 189, 248, 1)); }
    }

    .status-card {
      background: rgba(22, 25, 30, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(234, 179, 8, 0.2);
      border-radius: 20px;
      width: 100%;
      max-width: 360px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .miner-rate {
      font-size: 15px;
      color: #cbd5e1;
      margin-bottom: 12px;
    }
    .miner-rate span {
      color: #eab308;
      font-weight: 700;
    }
    .claim-btn {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      border: none;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      background: linear-gradient(135deg, #fef08a 0%, #eab308 50%, #ca8a04 100%);
      color: #0f172a;
      box-shadow: 0 4px 20px rgba(234, 179, 8, 0.3);
      transition: all 0.2s ease;
    }
    .claim-btn:disabled {
      background: #334155;
      color: #94a3b8;
      box-shadow: none;
      cursor: not-allowed;
    }
    .timer {
      margin-top: 10px;
      font-size: 13px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <!-- Динамічний фон із фоновими частинками -->
  <div class="bg-particles" id="particles"></div>

  <div class="header">
    <span class="tag">VELOCITON GOLD MINER</span>
    <div class="balance-box">
      <span class="balance-label">Total Balance</span>
      <div id="balance" class="balance-amount">0.0000</div>
    </div>
  </div>

  <div class="miner-container">
    <div class="gold-orb">
      <div class="coin-lightning">⚡</div>
    </div>
  </div>

  <div class="status-card">
    <div class="miner-rate">Mining Speed: <span>+0.001 $pVTON / sec</span></div>
    <button id="claimBtn" class="claim-btn">CLAIM MINED VTON</button>
    <div id="timer" class="timer">Mined pending: 0.0000 $pVTON</div>
  </div>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    // Генерація плаваючих частинок на фоні
    const particlesContainer = document.getElementById('particles');
    for (let i = 0; i < 18; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = Math.random() * 4 + 2;
      p.style.width = `${size}px`;
      p.style.height = `${size}px`;
      p.style.left = `${Math.random() * 100}%`;
      p.style.animationDelay = `${Math.random() * 5}s`;
      p.style.animationDuration = `${Math.random() * 5 + 5}s`;
      particlesContainer.appendChild(p);
    }

    let balance = parseFloat(localStorage.getItem('vton_gold_balance')) || 0.0;
    let pending = parseFloat(localStorage.getItem('vton_gold_pending')) || 0.0;
    const rate = 0.001;

    const balanceEl = document.getElementById('balance');
    const timerEl = document.getElementById('timer');
    const claimBtn = document.getElementById('claimBtn');

    function updateDisplay() {
      balanceEl.innerText = balance.toFixed(4);
      timerEl.innerText = `Mined pending: ${pending.toFixed(4)} $pVTON`;
      claimBtn.disabled = pending < 0.01;
    }

    setInterval(() => {
      pending += rate;
      localStorage.setItem('vton_gold_pending', pending);
      updateDisplay();
    }, 1000);

    claimBtn.addEventListener('click', () => {
      if (pending >= 0.01) {
        balance += pending;
        pending = 0.0;
        localStorage.setItem('vton_gold_balance', balance);
        localStorage.setItem('vton_gold_pending', pending);
        updateDisplay();
        
        if (window.Telegram && window.Telegram.WebApp.HapticFeedback) {
          window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
        }
      }
    });

    updateDisplay();
  </script>
</body>
</html>
